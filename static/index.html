<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonzai X API Explorer</title>
  <style>
    :root {
      --bg: #080b12;
      --bg-soft: #0f1520;
      --card: #121a27;
      --card-soft: #0d131e;
      --line: #223042;
      --line-soft: #1a2433;
      --text: #d8e2f1;
      --muted: #8ba0bf;
      --ok: #34d399;
      --bad: #fb7185;
      --warn: #f59e0b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Space Grotesk", "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1000px 480px at 15% -10%, #1d2f54 0%, transparent 60%),
        radial-gradient(900px 420px at 90% -20%, #30214a 0%, transparent 65%),
        var(--bg);
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .hero {
      background: linear-gradient(180deg, #111a2a 0%, #0d131d 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 14px 36px #0000004d;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: clamp(1.1rem, 2.6vw, 1.85rem);
      font-weight: 800;
      letter-spacing: 0.2px;
      line-height: 1.15;
    }

    .badge-flask {
      display: inline-block;
      margin-left: 8px;
      font-size: 0.66rem;
      line-height: 1;
      padding: 5px 8px;
      border-radius: 999px;
      background: #16a34a1e;
      color: #86efac;
      border: 1px solid #16a34a55;
      vertical-align: middle;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .count-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #0b1018;
      color: #a6b8d2;
      white-space: nowrap;
    }

    .toolbar {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search {
      flex: 1;
      min-width: 220px;
      background: #0b1018;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.84rem;
      outline: none;
    }

    .search::placeholder {
      color: #6f84a3;
    }

    .search:focus {
      border-color: #3d5c87;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .ghost-btn {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0b1018;
      color: #a8bdd9;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .ghost-btn:hover {
      background: #101828;
    }

    .category {
      margin-top: 18px;
    }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 2px 10px;
    }

    .cat-label {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: #7f96b8;
    }

    .cat-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, #2a3a52, transparent);
    }

    .group {
      border: 1px solid var(--line);
      border-left: 3px solid var(--p, #334155);
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .group-header {
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .group-header:hover {
      background: #162033;
    }

    .group-head-left {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .group-title {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .group-badge {
      font-size: 0.62rem;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .group-count {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: monospace;
    }

    .chevron {
      font-size: 0.72rem;
      color: #7f93b3;
      transition: transform 0.2s ease;
    }

    .chevron.open {
      transform: rotate(180deg);
    }

    .group-body {
      display: none;
      padding: 10px;
      border-top: 1px solid var(--line-soft);
      background: #0d131e;
    }

    .group-body.open {
      display: block;
    }

    .ep {
      border: 1px solid var(--line-soft);
      border-radius: 11px;
      background: var(--card-soft);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .ep.is-disabled {
      opacity: 0.6;
      filter: grayscale(1);
    }

    .maintenance-badge {
      font-size: 0.6rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #ef4444;
      color: white;
      font-weight: bold;
      margin-left: 8px;
      display: none;
    }

    .ep.is-disabled .maintenance-badge {
      display: inline-block;
    }
    
    .btn-admin-toggle {
      border: 1px solid #eab308;
      background: transparent;
      color: #eab308;
      padding: 6px 12px;
      font-size: 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 10px;
    }
    
    .btn-admin-toggle.active {
      background: #eab308;
      color: #000;
      font-weight: bold;
    }

    .admin-controls {
      display: none;
      padding: 10px;
      background: #1e1e1e;
      border-bottom: 1px dashed #333;
      text-align: right;
    }

    .admin-mode-active .admin-controls {
      display: block;
    }
    
    .btn-toggle-maint {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    
    .ep.is-disabled .btn-toggle-maint {
      background: #22c55e;
      color: white;
      border-color: #16a34a;
    }

    .ep-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .ep-header:hover {
      background: #121d2c;
    }

    .ep-method {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      padding: 3px 7px;
      border-radius: 999px;
      font-family: monospace;
      background: #14532d;
      color: #86efac;
    }

    .ep-path {
      font-family: monospace;
      font-size: 0.74rem;
      color: #bfd0ea;
      word-break: break-all;
    }

    .ep-desc {
      margin-left: auto;
      color: #7f96b8;
      font-size: 0.67rem;
      font-weight: 600;
    }

    .ep-body {
      display: none;
      border-top: 1px solid var(--line-soft);
      padding: 12px;
    }

    .ep-body.open {
      display: block;
    }

    .field {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      margin-bottom: 8px;
    }

    .field label {
      font-size: 0.66rem;
      font-family: monospace;
      color: var(--muted);
      text-transform: lowercase;
    }

    .field label.req {
      color: #f9a8d4;
    }

    .field input {
      width: 100%;
      background: #0b1018;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 9px;
      color: #d4e1f6;
      font-size: 0.77rem;
      font-family: monospace;
      outline: none;
    }

    .field input:focus {
      border-color: #4f6ea0;
    }

    .url-bar {
      display: flex;
      gap: 7px;
      margin: 10px 0;
    }

    .url-bar input {
      flex: 1;
      min-width: 0;
      background: #090e15;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      color: #8ba0bf;
      font-size: 0.66rem;
      padding: 8px 9px;
      font-family: monospace;
      outline: none;
    }

    .btn-copy {
      border: 1px solid var(--line);
      background: #101726;
      color: #aec2e0;
      border-radius: 8px;
      font-size: 0.66rem;
      font-weight: 800;
      padding: 8px 10px;
      cursor: pointer;
    }

    .btn-copy:hover {
      background: #162238;
    }

    .btn-send {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 0.76rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-send:hover {
      filter: brightness(1.12);
    }

    .btn-send:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .resp {
      margin-top: 9px;
      border: 1px solid var(--line-soft);
      border-radius: 9px;
      overflow: hidden;
      background: #080d14;
    }

    .resp-bar {
      padding: 6px 9px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: #0c131f;
    }

    .resp-status {
      font-size: 0.64rem;
      font-weight: 800;
      color: #7f96b8;
    }

    .resp-time {
      font-size: 0.62rem;
      color: #7f96b8;
      font-family: monospace;
      margin-left: auto;
    }

    .btn-copy-resp {
      border: 1px solid var(--line);
      background: #111a29;
      color: #b8cbea;
      border-radius: 7px;
      font-size: 0.61rem;
      padding: 5px 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-copy-resp:hover {
      background: #1a2a45;
    }

    .resp-body {
      padding: 10px;
      max-height: 300px;
      overflow: auto;
    }

    .resp-body pre {
      font-size: 0.67rem;
      line-height: 1.42;
      font-family: monospace;
      color: var(--ok);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .resp-body pre.error {
      color: var(--bad);
    }

    .resp-body pre.ok {
      color: var(--ok);
    }

    .empty {
      margin-top: 12px;
      padding: 20px;
      text-align: center;
      color: #8ba0bf;
      background: #0f1624;
      border: 1px dashed #2b3b54;
      border-radius: 12px;
      font-size: 0.78rem;
    }

    .footer {
      margin-top: 22px;
      padding: 20px 8px 8px;
      text-align: center;
      border-top: 1px solid #1f2d40;
    }

    .footer p {
      color: #7f96b8;
      font-size: 0.73rem;
      margin-bottom: 12px;
    }

    .footer-links,
    .top-links {
      display: flex;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .top-links {
      margin-top: 14px;
      justify-content: flex-start;
    }

    .footer-links a,
    .top-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.69rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid #233248;
      background: #0f1624;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .footer-links a:hover,
    .top-links a:hover {
      transform: translateY(-1px);
    }

    .footer-links .tg,
    .top-links .tg {
      color: #7dd3fc;
    }

    .footer-links .donate,
    .top-links .donate {
      color: #f9a8d4;
    }

    .footer-links .gh,
    .top-links .gh {
      color: #c4b5fd;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a3a52;
      border-radius: 12px;
    }

    @media (min-width: 760px) {
      .field {
        grid-template-columns: 120px minmax(0, 1fr);
        align-items: center;
      }

      .field label {
        text-align: right;
        padding-right: 6px;
      }
    }
  </style>
</head>

    // ═══════════════════════════════════════════════════════════════════════
    // UI GENERATOR
    // ═══════════════════════════════════════════════════════════════════════

    function uid(p, ep) { return p.id + '_' + ep.id; }

    function buildUrl(p, ep) {
      const key = uid(p, ep);
      const params = new URLSearchParams();
      let path = ep.path;
      for (const f of ep.fields) {
        const el = document.getElementById('f_' + key + '_' + f.name);
        const val = el ? el.value : '';
        if (ep.pathParam && f.name === 'id' && val) { path += '/' + val; }
        else if (val) { params.append(f.name, val); }
      }
      const qs = params.toString();
      return BASE + path + (qs ? '?' + qs : '');
    }

    function refreshUrl(p, ep) {
      const key = uid(p, ep);
      const urlEl = document.getElementById('url_' + key);
      const builtUrl = buildUrl(p, ep);
      if (urlEl) urlEl.value = builtUrl;
      if (ep.isDownload) {
        const btn = document.getElementById('btn_' + key);
        if (btn) btn.href = builtUrl;
      }
    }

    function renderField(key, f) {
      return '<div class="field"><label class="' + (f.required ? 'req' : '') + '">' + f.label + (f.required ? '*' : '') + '</label><input id="f_' + key + '_' + f.name + '" type="' + (f.type || 'text') + '" value="' + (f.value || '') + '" oninput="refreshUrl_' + key + '()"></div>';
    }

    function renderEndpoint(p, ep) {
      const key = uid(p, ep);
      const color = p.color;
      const btnHtml = ep.isDownload
        ? '<a class="btn-send" id="btn_' + key + '" style="background:' + color + '" target="_blank" href="#">Open / Download File</a>'
        : '<button class="btn-send" id="btn_' + key + '" style="background:' + color + '" onclick="sendReq(\'' + key + '\')">Send Request</button>';

      const providerId = p.id;
      const pathToCheck = ep.displayPath || ep.path;
      const isDisabled = window.disabledProviders && window.disabledProviders.includes(providerId);
      const disabledClass = isDisabled ? ' is-disabled' : '';
      const toggleText = isDisabled ? 'Enable Provider' : 'Disable Provider';

      return '<div class="ep' + disabledClass + '" id="ep_wrapper_' + key + '">' +
        '<div class="admin-controls">' +
          '<button class="btn-toggle-maint" onclick="toggleMaintenance(\'' + providerId + '\', \'' + key + '\')">' + toggleText + '</button>' +
        '</div>' +
        '<div class="ep-header" onclick="toggleEp(\'' + key + '\')">' +
          '<span class="ep-method">GET</span>' +
          '<span class="ep-path">' + pathToCheck + '</span>' +
          '<span class="maintenance-badge" title="Provider disabled by admin">MAINTENANCE</span>' +
          '<span class="ep-desc">' + ep.desc + '</span>' +
        '</div>' +
        '<div class="ep-body" id="epb_' + key + '">' +
          ep.fields.map(f => renderField(key, f)).join('') +
          '<div class="url-bar"><input type="text" id="url_' + key + '" readonly><button class="btn-copy" onclick="copyUrl(\'' + key + '\')">Copy</button></div>' +
          btnHtml +
          '<div class="resp"><div class="resp-bar"><span class="resp-status" id="st_' + key + '">READY</span><span class="resp-time" id="tm_' + key + '"></span><button class="btn-copy-resp" id="btncopy_' + key + '" onclick="copyResp(\'' + key + '\')">Copy</button></div><div class="resp-body"><pre id="out_' + key + '">// Waiting...</pre></div></div>' +
        '</div></div>';
    }

    function renderProvider(p) {
      const n = p.endpoints.length;
      return '<div class="group" style="--p:' + p.color + '"><div class="group-header" onclick="toggleGroup(\'' + p.id + '\')"><div class="group-head-left"><span class="group-title" style="color:' + p.color + '">' + p.name + '</span><span class="group-badge" style="background:' + p.color + '22;color:' + p.color + ';border:1px solid ' + p.color + '44">' + p.badge + '</span><span class="group-count">' + n + ' endpoint' + (n > 1 ? 's' : '') + '</span></div><span class="chevron" id="chev_' + p.id + '">▼</span></div><div class="group-body" id="gb_' + p.id + '">' + p.endpoints.map(ep => renderEndpoint(p, ep)).join('') + '</div></div>';
    }

    const ORDER = ['Short Drama API', 'Movie API', 'Tool API', 'Anime API', 'Manga API'];
    let visibleProviders = [];

    function renderApp(filterText = '') {
      const q = (filterText || '').trim().toLowerCase();
      visibleProviders = q
        ? PROVIDERS.filter(p => {
          const hay = (
            p.name + ' ' + p.category + ' ' + p.badge + ' ' +
            p.endpoints.map(ep => (ep.id + ' ' + ep.path + ' ' + (ep.displayPath || '') + ' ' + ep.desc)).join(' ')
          ).toLowerCase();
          return hay.includes(q);
        })
        : PROVIDERS.slice();

      const grouped = {};
      visibleProviders.forEach(p => {
        const c = p.category || 'Other';
        if (!grouped[c]) grouped[c] = [];
        grouped[c].push(p);
      });

      let html = '';
      ORDER.forEach(cat => {
        if (!grouped[cat] || grouped[cat].length === 0) return;
        html += '<div class="category"><div class="cat-header"><span class="cat-label">' + cat + '</span><span class="cat-line"></span></div>' + grouped[cat].map(renderProvider).join('') + '</div>';
      });

      if (!html) {
        html = '<div class="empty">Tidak ada provider yang cocok dengan pencarian.</div>';
      }

      html += '<div class="footer"><p>Built by Sonzai X · Python/Flask Edition · APIs for educational purposes.</p></div>';
      document.getElementById('app').innerHTML = html;
      document.getElementById('countInfo').textContent = visibleProviders.length + ' providers';

      visibleProviders.forEach(p => {
        p.endpoints.forEach(ep => {
          const key = uid(p, ep);
          window['refreshUrl_' + key] = () => refreshUrl(p, ep);
          refreshUrl(p, ep);
        });
      });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ADMIN & MAINTENANCE LOGIC
    // ═══════════════════════════════════════════════════════════════════════
    
    window.disabledEndpoints = [];
    window.isAdminMode = false;

    async function fetchMaintenance() {
      try {
        const res = await fetch(BASE + '/admin/maintenance');
        const data = await res.json();
        if (data && data.disabled_endpoints) {
          window.disabledEndpoints = data.disabled_endpoints;
          renderApp(document.getElementById('qSearch').value); // Re-render to apply disabled styles
        }
      } catch (err) {
        console.error("Failed to fetch maintenance status", err);
      }
    }

    window.toggleAdminMode = async function() {
      if (!window.isAdminMode) {
        const pw = prompt("Enter Admin Password:");
        try {
          const res = await fetch(BASE + '/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw })
          });
          const data = await res.json();
          if (data.status !== "success") {
            alert("Invalid password!");
            return;
          }
        } catch (err) {
          alert("Login failed: " + err);
          return;
        }
      } else {
        // Logout
        try {
          await fetch(BASE + '/admin/logout', { method: 'POST' });
        } catch (err) {}
      }

      window.isAdminMode = !window.isAdminMode;
      const btn = document.getElementById('btnAdmin');

      if (window.isAdminMode) {
        btn.classList.add('active');
        btn.textContent = 'Admin: ON';
        document.body.classList.add('admin-mode-active');
      } else {
        btn.classList.remove('active');
        btn.textContent = 'Admin: OFF';
        document.body.classList.remove('admin-mode-active');
      }
      // Refresh maintenance state + re-render
      await fetchMaintenance();
      renderApp(document.getElementById('qSearch').value);
    };

    window.toggleMaintenance = async function(providerOrPath, key) {
      if (!window.isAdminMode) return;

      // Provider-level toggle — use provider ID (first segment of path)
      let provider = providerOrPath;
      if (providerOrPath.startsWith('/')) {
        provider = providerOrPath.split('/')[1];
      }

      const currentlyDisabled = window.disabledProviders && window.disabledProviders.includes(provider);
      const disable = !currentlyDisabled;

      try {
        const res = await fetch(BASE + '/admin/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ provider: provider, disable: disable })
        });

        const data = await res.json();
        if (data.status === "success") {
          window.disabledProviders = data.disabled_providers;
          await fetchMaintenance();
          renderApp(document.getElementById('qSearch').value);
        } else if (data.message && data.message.includes("login")) {
          alert("Admin session expired. Please toggle admin again.");
        } else {
          alert("Error: " + (data.message || data.error));
        }
      } catch(err) {
        alert("Failed to toggle maintenance: " + err);
      }
    };

    // Initialize maintenance state
    window.addEventListener('DOMContentLoaded', fetchMaintenance);

    // Update fetchMaintenance + renderEndpoint for provider-level
    const origFetchMaintenance = fetchMaintenance;
    fetchMaintenance = async function() {
      try {
        const res = await fetch(BASE + '/admin/maintenance');
        const data = await res.json();
        // Support both old (disabled_endpoints) and new (disabled_providers) format
        window.disabledProviders = data.disabled_providers || data.disabled_endpoints || [];
        window.disabledEndpoints = window.disabledProviders; // keep compat
      } catch (err) {
        console.error("Failed to fetch maintenance status", err);
      }
    };

    window.filterProviders = function (text) {
      renderApp(text);
    };

    renderApp('');

    window.expandAll = function () {
      document.querySelectorAll('.group-body').forEach(el => el.classList.add('open'));
      document.querySelectorAll('.chevron').forEach(el => el.classList.add('open'));
    };

    window.collapseAll = function () {
      document.querySelectorAll('.group-body').forEach(el => el.classList.remove('open'));
      document.querySelectorAll('.chevron').forEach(el => el.classList.remove('open'));
      document.querySelectorAll('.ep-body').forEach(el => el.classList.remove('open'));
    };

    PROVIDERS.forEach(p => {
      p.endpoints.forEach(ep => {
        const key = uid(p, ep);
        window['refreshUrl_' + key] = () => refreshUrl(p, ep);
      });
    });

    window.toggleGroup = function (id) {
      document.getElementById('gb_' + id).classList.toggle('open');
      document.getElementById('chev_' + id).classList.toggle('open');
    };
    window.toggleEp = function (key) { document.getElementById('epb_' + key).classList.toggle('open'); };
    window.copyUrl = function (key) {
      const el = document.getElementById('url_' + key);
      navigator.clipboard.writeText(el.value);
      const btn = el.nextElementSibling; btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1200);
    };
    window.copyResp = function (key) {
      const cb = document.getElementById('out_' + key);
      const btn = document.getElementById('btncopy_' + key);
      if (cb && btn) { navigator.clipboard.writeText(cb.innerText); btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1200); }
    };
    window.sendReq = async function (key) {
      const btn = document.getElementById('btn_' + key), out = document.getElementById('out_' + key);
      const st = document.getElementById('st_' + key), tm = document.getElementById('tm_' + key);
      const url = document.getElementById('url_' + key).value;
      btn.disabled = true; btn.textContent = 'Loading...'; out.textContent = '// Sending request...'; out.className = '';
      st.textContent = 'LOADING'; st.style.color = '#f59e0b'; tm.textContent = '';
      const t0 = performance.now();
      try {
        const res = await fetch(url); const ms = Math.round(performance.now() - t0);
        tm.textContent = ms + 'ms'; st.textContent = res.status + ' ' + res.statusText;
        const ct = res.headers.get('content-type') || '';
        let data;
        if (ct.includes('json')) { try { data = await res.json(); } catch { data = { error: 'Failed to parse JSON' }; } }
        else { const txt = await res.text(); data = { message: 'Non-JSON', preview: txt.substring(0, 500) }; }
        out.textContent = JSON.stringify(data, null, 2);
        if (res.ok) { st.style.color = '#34d399'; out.className = 'ok'; }
        else { st.style.color = '#f87171'; out.className = 'error'; }
      } catch (err) { st.textContent = 'NET ERROR'; st.style.color = '#f87171'; out.textContent = '// Error: ' + err.message; out.className = 'error'; }
      finally { btn.disabled = false; btn.textContent = 'Send Request'; }
    };
  </script>
